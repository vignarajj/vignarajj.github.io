name: Pull Request Validation

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Skip if draft PR
  check-draft:
    runs-on: ubuntu-latest
    outputs:
      is-draft: ${{ steps.check-draft.outputs.is-draft }}
    steps:
    - name: Check if PR is draft
      id: check-draft
      run: |
        if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
          echo "is-draft=true" >> $GITHUB_OUTPUT
        else
          echo "is-draft=false" >> $GITHUB_OUTPUT
        fi

  # Quick validation for PRs
  validate:
    needs: check-draft
    if: needs.check-draft.outputs.is-draft == 'false'
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        task: [format, analyze, test, build]
    
    steps:
    - name: 📚 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: 🐦 Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.3'
        channel: 'stable'
        cache: true
        
    - name: 📥 Install dependencies
      run: flutter pub get
      
    - name: 🧹 Check formatting
      if: matrix.task == 'format'
      run: |
        dart format --output=none --set-exit-if-changed .
        echo "✅ Code formatting is correct"
        
    - name: 📊 Analyze code
      if: matrix.task == 'analyze'
      run: |
        flutter analyze --fatal-infos
        echo "✅ Static analysis passed"
        
    - name: 🧪 Run tests
      if: matrix.task == 'test'
      run: |
        if [ -d "test" ]; then
          flutter test --coverage
          echo "✅ All tests passed"
        else
          echo "ℹ️ No tests found"
        fi
        
    - name: 🏗️ Build web
      if: matrix.task == 'build'
      run: |
        flutter build web --release
        echo "✅ Build completed successfully"
        
  # Create PR comment with validation results
  comment:
    needs: [check-draft, validate]
    if: always() && needs.check-draft.outputs.is-draft == 'false'
    runs-on: ubuntu-latest
    
    steps:
    - name: 💬 Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('## 🤖 PR Validation Results')
          );
          
          const validationStatus = '${{ needs.validate.result }}';
          const statusEmoji = validationStatus === 'success' ? '✅' : '❌';
          
          const body = `## 🤖 PR Validation Results ${statusEmoji}
          
          **Status**: ${validationStatus === 'success' ? 'All checks passed!' : 'Some checks failed'}
          
          **Commit**: ${context.sha.substring(0, 7)}
          **Branch**: ${context.payload.pull_request.head.ref}
          **Triggered by**: @${context.actor}
          
          ${validationStatus === 'success' ? 
            '🎉 Your PR is ready for review!' : 
            '⚠️ Please check the failed validations and update your PR.'
          }
          
          ---
          <sub>🤖 This comment was automatically generated by GitHub Actions</sub>`;
          
          if (botComment) {
            github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }